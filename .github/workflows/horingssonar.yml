name: HøringsSonar Scan

on:
  schedule:
    - cron: '0 7 * * 3'  # Onsdag kl 07:00 UTC (08:00/09:00 norsk tid)
  workflow_dispatch:  # Manuell kjøring

permissions:
  contents: write

jobs:
  scan_and_monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run HøringsSonar
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
      run: python horingssonar.py

    - name: Commit cache and reports
      run: |
        git config --global user.name "HøringsSonar Bot"
        git config --global user.email "horingssonar@bot.local"
        git add horingssonar_cache.json horingssonar_rapport_*.md horingssonar_rapport_*.json || true
        git diff --staged --quiet || git commit -m "HøringsSonar: Rapport $(date +'%Y-%m-%d')"
        git push || true
